# Alembic = database migration tool. Each file in alembic/versions/ is one
# versioned, reversible change to the schema (like git commits for the database).
#
#   alembic upgrade head        apply all migrations
#   alembic downgrade -1        undo the latest migration
#   alembic revision --autogenerate -m "msg"   draft a migration from model changes
#   alembic check               fail if models and migrations disagree
#
# The database URL comes from app settings (.env), never from this file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
