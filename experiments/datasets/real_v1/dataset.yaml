# real_v1 — DRAFT evaluation dataset over 16 real, public patents (3 domains).
#
# STATUS: DRAFT. Questions and labels were written by the AI coding assistant on
# 2026-10-04 and have NOT been verified. Before any result on this dataset is reported:
#   1. two team members check every item (question sensible? labels complete and
#      correct? key facts right?) and record changes in `notes`;
#   2. set `labelled_by` to the team members and remove "DRAFT" from this header;
#   3. use it as the DEV set: the agent was already tuned on it (Phase 10). Write the TEST
#      questions independently (docs/dataset_guide.md §4) and freeze them.
#   Labels list only 1-2 passages per question; real patents repeat facts in several
#   places, so add every passage that answers the question (see REVIEW.md).
# Corpus: experiments/datasets/real_v1/corpus, built with backend/scripts/build_corpus.py
# from Google Patents pages (public documents). Similar-patent search items are not
# included yet: they need EPO credentials.
name: real_v1
description: DRAFT - 16 real patents (wireless-charging foreign object detection, EV battery thermal management, immersion cooling); AI-drafted labels awaiting two-person verification.
synthetic: false
labelled_by: "DRAFT: AI coding assistant, not yet verified by the team"

corpus:
  # wireless charging: foreign object detection
  - {id: fod_coils, file: corpus/US9178361B2.txt}       # small detection coils
  - {id: peak_freq, file: corpus/US11646607B2.txt}      # receiver reports reference peak frequency
  - {id: sensing_coil, file: corpus/US11316383B1.txt}   # separate sensing coil vs. interference
  - {id: ml_fod, file: corpus/US20190074730A1.txt}      # machine-learning FOD
  - {id: impedance_fod, file: corpus/US20220115917A1.txt}  # detection-coil impedance (EV pad)
  - {id: qfactor, file: corpus/US10804750B2.txt}        # Q-factor by free oscillation
  # EV battery thermal management
  - {id: parallel_loops, file: corpus/US11214114B2.txt} # battery + motor loops, radiator
  - {id: offboard, file: corpus/US20170297431A1.txt}    # off-board coolant while charging
  - {id: pid_chiller, file: corpus/US20230415612A1.txt} # PID control of chiller/EXV/pump
  - {id: predictive, file: corpus/US20190315232A1.txt}  # route/weather predictive control
  - {id: kalman, file: corpus/US20160079633A1.txt}      # EKF temperature estimation
  - {id: hvac_chiller, file: corpus/US20090249807A1.txt} # HVAC + battery chiller loop
  # immersion cooling
  - {id: runners, file: corpus/US20250079567A1.txt}     # manifolds/runners per module
  - {id: grouped, file: corpus/US20230369708A1.txt}     # cell groups, dividers, gas manifold
  - {id: sealed, file: corpus/US8852772B2.txt}          # sealed modules, heater + cooler inside
  - {id: electronics, file: corpus/US12563707B2.txt}    # chip cooling (near neighbour, not batteries)

items:
  # ================================================================ single-fact lookups
  - id: r01
    type: lookup
    question: In the Q-factor measurement method, how is the coil circuit made to ring on its own?
    relevant:
      - {doc: qfactor, section: abstract}
    key_facts: ["ground"]
    expected_intent: document_qa
    expected_tools: [search_uploaded_documents]

  - id: r02
    type: lookup
    question: Over what frequency range might a wireless charger sweep when it measures the Q-factor?
    relevant:
      - {doc: qfactor, contains: "from a low frequency (for example 80 kHz)"}
    key_facts: ["80 kHz", "120 kHz"]
    expected_intent: document_qa
    expected_tools: [search_uploaded_documents]

  - id: r03
    type: lookup
    question: By default, how long does each foreign object detection window last in the charger that uses a separate sensing coil?
    relevant:
      - {doc: sensing_coil, contains: "periods TP of about 100 microseconds"}
    key_facts: ["100 microseconds"]
    expected_intent: document_qa
    expected_tools: [search_uploaded_documents]

  - id: r04
    type: lookup
    question: What does the charger do when the measured Q factor drifts too far from its baseline value?
    relevant:
      - {doc: sensing_coil, contains: "deviates by more than a threshold amount from the baseline"}
    key_facts: ["halted"]
    expected_intent: document_qa
    expected_tools: [search_uploaded_documents]

  - id: r05
    type: lookup
    question: How does the machine-learning based charging pad decide whether a foreign object is present?
    relevant:
      - {doc: ml_fod, section: abstract}
      - {doc: ml_fod, contains: "probability value indicative of whether a foreign object is present"}
    key_facts: ["probability", "threshold"]
    expected_intent: document_qa
    expected_tools: [search_uploaded_documents]

  - id: r06
    type: lookup
    question: At roughly what frequency does the machine-learning charging pad transmit power?
    relevant:
      - {doc: ml_fod, contains: "a predetermined frequency of about 125 kHz"}
    key_facts: ["125 kHz"]
    expected_intent: document_qa
    expected_tools: [search_uploaded_documents]

  - id: r07
    type: lookup
    question: Which everyday metal objects are given as examples of foreign objects that heat up from eddy currents in the detection-coil patent?
    relevant:
      - {doc: fod_coils, contains: "(e.g. a ring or a coin)"}
    key_facts: ["ring", "coin"]
    expected_intent: document_qa
    expected_tools: [search_uploaded_documents]
    notes: Several patents mention coins; the ring example is specific to fod_coils.

  - id: r08
