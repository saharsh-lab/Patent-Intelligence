    expected_tools: [search_uploaded_documents]
    notes: "Audit 2026-10-04: key fact 'suspend' -> 'differentiate'. The question asks why; the reason is that the detection cannot differentiate transferred power from power lost in a foreign object ('suspend' is the remedy)."

