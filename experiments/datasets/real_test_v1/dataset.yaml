# real_test_v1 — TEST set over the same 16 real patents as real_v1 (the dev set).
#
# Written on 2026-10-04 by the AI coding assistant from the patent texts only, BEFORE any
# system run on these questions, and frozen (see FROZEN.md). It must never be used for
# tuning. Questions use different facts from the dev set.
#
# STATUS: labels drafted and then audited item by item by the AI assistant (2026-10-04,
# after the final runs; corrections recorded in each item's notes). NOT verified by a
# human: state this wherever results are reported. Changing questions is not allowed.
name: real_test_v1
description: TEST set - 53 questions over 16 real patents (wireless-charging foreign object detection, EV battery thermal management, immersion cooling); frozen before any run; labels AI-drafted and AI-audited, not human-verified.
synthetic: false
labelled_by: "AI coding assistant (drafted, then audited item by item on 2026-10-04); not human-verified"

